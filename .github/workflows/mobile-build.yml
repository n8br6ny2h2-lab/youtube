# Efsun Avcısı — bulutta Android ve iOS derlemesi (bilgisayar gerekmez)
#
# Gizli anahtarlar (Settings > Secrets and variables > Actions) yoksa:
#   Android: imzasız test APK'sı üretir    iOS: simülatör için derleyip derlemenin hatasız olduğunu doğrular
# Gizli anahtarlar eklenince:
#   Android: imzalı AAB (Google Play'e yüklenecek dosya)    iOS: imzalı derleme + otomatik TestFlight yüklemesi
#
# Kullanılan gizli anahtarlar (hepsi isteğe bağlı):
#   GOOGLE_SERVICES_JSON, GOOGLE_SERVICE_INFO_PLIST    Firebase dosyalarının İÇERİĞİ (olduğu gibi yapıştır)
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   Play yükleme anahtarı
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API anahtarı (.p8 içeriği olduğu gibi)
name: Mobil Derleme

on:
  push:
    paths: ['game/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false   # çalışan derleme yarıda kesilmesin; yenisi sırada bekler

defaults:
  run:
    working-directory: game

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: game/package-lock.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund
      - name: Android projesi
        run: |
          npm run build
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          npm run native-setup
          npm run assets
          npx cap sync android
      - name: Test APK (imzasız)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: İmzalı AAB (Google Play)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: game/android
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: efsun-avcisi-android-${{ github.run_number }}
          path: |
            game/android/app/build/outputs/apk/debug/*.apk
            game/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8 != '' }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: game/package-lock.json }
      - name: En yeni Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund
      - name: iOS projesi
        run: |
          npm run build
          npx cap add ios
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist; fi
          npm run native-setup
          npm run assets
          npx cap sync ios
      - name: Derleme kontrolü (simülatör, imzasız)
        if: env.HAS_SIGNING != 'true'
        working-directory: game/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
      - name: İmzalı derleme ve TestFlight'a yükleme
        if: env.HAS_SIGNING == 'true'
        working-directory: game/ios/App
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic $AUTH archive | tail -40
          test ${PIPESTATUS[0]} -eq 0
          python3 -c "import plistlib,sys; plistlib.dump({'method':'app-store-connect','destination':'upload','teamID':sys.argv[1],'signingStyle':'automatic','manageAppVersionAndBuildNumber':False}, open(sys.argv[2],'wb'))" "$APPLE_TEAM_ID" "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH | tail -40
          test ${PIPESTATUS[0]} -eq 0
          rm -f "$KEY"
          echo "✅ TestFlight'a yüklendi (App Store Connect'te işlenmesi 10-30 dk sürer)"
